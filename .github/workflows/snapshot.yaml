name: Publish Nightly Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox-script
    steps:
      - uses: actions/checkout@v7

      - name: Install Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: roblox-script

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roblox-script/package-lock.json

      - run: npm ci

      - name: Resolve version
        run: echo "VERSION=$(date +'%yd%ja')" >> "$GITHUB_ENV"

      - name: Compile roblox-ts
        run: npm run compile

      - name: Build model
        run: npm run build

      - name: Bundle modules
        run: |
          remodel run ci/bundle.lua public/snapshot.lua "$VERSION" minify
          remodel run ci/bundle.lua public/snapshot.debug.lua "$VERSION-dbg" debug

      - name: Commit bundles
        uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actions
          cwd: roblox-script
          add: "['public/snapshot.lua', 'public/snapshot.debug.lua']"
          message: "Nightly snapshot ${{ env.VERSION }}"
