name: Publish Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox-script
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: roblox-script

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roblox-script/package-lock.json

      - run: npm ci

      - name: Resolve version
        run: echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Compile roblox-ts
        run: npm run compile

      - name: Build model
        run: npm run build

      - name: Bundle modules
        run: |
          remodel run ci/bundle.lua public/latest.lua "$VERSION"
          remodel run ci/bundle.lua public/latest.debug.lua "$VERSION-dbg" debug

      - name: Commit bundles
        uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actions
          cwd: roblox-script
          add: "['public/latest.lua', 'public/latest.debug.lua']"
          message: "Release ${{ env.VERSION }}"
