name: ESLint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox-script
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roblox-script/package-lock.json

      - run: npm ci

      - name: Compile roblox-ts
        run: npm run compile

      - name: Run ESLint
        run: npm run lint
